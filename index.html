<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スマホ向けタイトル画面</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container" id="gameContainer">
        <div class="top-bar">
            <button id="fullscreenBtn">全画面</button>
            <button id="resetBtn">初期化</button>
        </div>

        <canvas id="gameCanvas" width="450" height="850"></canvas>
        <!-- ダイアログ（初期化確認画面） -->
<div id="dialogOverlay" class="dialog-overlay" style="display: none;">
    <div class="dialog-box">
        <p id="dialogMessage">初期化しますか？</p>
        <div class="dialog-buttons">
            <button id="dialogYesBtn">はい</button>
            <button id="dialogNoBtn">いいえ</button>
        </div>
    </div>
</div>

        <!-- STARTボタン（タイトル画面専用） -->
        <button id="startBtn">START</button>

        <!-- メニュー画面用UI -->
        <div id="menuUI" style="display: none;">
            <div class="tab-bar">
                <button class="tab-btn" data-tab="stage">ステージ</button>
                <button class="tab-btn" data-tab="shop">ショップ</button>
                <button class="tab-btn" data-tab="other">その他</button>
            </div>
            
            <div class="stage-list">
                <button class="stage-btn" data-stage="1">信号</button>
                <button class="stage-btn" data-stage="2">遮断</button>
                <button class="stage-btn" data-stage="3">ステージ 3</button>
                <button class="stage-btn" data-stage="4">ステージ 4</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
