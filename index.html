<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スマホ向けタイトル画面</title>
    <style>
        /* 1. 画面全体を固定し、上下左右中央寄せ */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #111;
            
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        /* 2. ゲームコンテナ：9:16比率を完全に固定 */
        .game-container {
            position: relative;
            /* 常に9:16を維持したまま、画面（100vw × 100vh）に最大限収まるサイズを自動計算 */
            width: min(100vw, calc(100vh * (9 / 16)));
            height: min(100vh, calc(100vw * (16 / 9)));
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
        }

        /* HTMLのスタートボタン */
        #startBtn {
            position: absolute;
            left: 50%;
            bottom: 15%; /* 比率固定に合わせてパーセント指定で調整 */
            transform: translateX(-50%);
            width: 50%;
            height: 7.5%;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            background-color: #ff4081;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s, background-color 0.2s;
        }

        #startBtn:hover {
            background-color: #ff80ab;
            transform: translateX(-50%) scale(1.05);
        }

        #startBtn:active {
            transform: translateX(-50%) scale(0.95);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Canvas内部解像度は 450 x 800 で固定 -->
        <canvas id="gameCanvas" width="450" height="800"></canvas>
        <button id="startBtn">START</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const startBtn = document.getElementById("startBtn");

        // --------------------------------------------------
        // 1. 変数と状態の管理
        // --------------------------------------------------
        let scene = "title";

        const bgImage = new Image();
        bgImage.src = "title_bg.png"; // 画像ファイルを指定

        // 画像をアスペクト比を崩さずに描画
        function drawCoverImage(img) {
            const canvasRatio = canvas.width / canvas.height;
            const imgRatio = img.width / img.height;
            let sx, sy, sWidth, sHeight;

            if (imgRatio > canvasRatio) {
                sHeight = img.height;
                sWidth = img.height * canvasRatio;
                sx = (img.width - sWidth) / 2;
                sy = 0;
            } else {
                sWidth = img.width;
                sHeight = img.width / canvasRatio;
                sx = 0;
                sy = (img.height - sHeight) / 2;
            }

            ctx.drawImage(img, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);
        }

        // --------------------------------------------------
        // 2. イベント処理
        // --------------------------------------------------
        startBtn.addEventListener("click", () => {
            scene = "game";
            startBtn.style.display = "none";
        });

        // スクロール・横揺れ防止
        window.addEventListener("wheel", (e) => e.preventDefault(), { passive: false });
        window.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
        window.addEventListener("keydown", (e) => {
            const keysToBlock = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "PageUp", "PageDown"];
            if (keysToBlock.includes(e.key)) e.preventDefault();
        });

        // --------------------------------------------------
        // 3. 描画処理（メインループ）
        // --------------------------------------------------
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (scene === "title") {
                // --- 【タイトル画面】 ---
                if (bgImage.complete && bgImage.naturalWidth !== 0) {
                    drawCoverImage(bgImage);
                } else {
                    ctx.fillStyle = "#222";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                // タイトル文字
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 40px sans-serif";
                ctx.textAlign = "center";
                ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
                ctx.shadowBlur = 10;
                ctx.fillText("にゃんこ鍋", canvas.width / 2, 220);
                ctx.shadowBlur = 0;

            } else if (scene === "game") {
                // --- 【ゲームプレイ画面】 ---
                ctx.fillStyle = "#1b5e20";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 28px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("～ ゲーム画面 ～", canvas.width / 2, 400);
            }

            requestAnimationFrame(draw);
        }

        // ゲームループ開始
        draw();
    </script>
</body>
</html>
